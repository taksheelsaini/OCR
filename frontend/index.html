<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrOCR - Handwriting AI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        backdrop: '#0B0B0F',
                        glass: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        accent: '#6366f1', // Indigo
                        accentGlow: 'rgba(99, 102, 241, 0.4)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scan': 'scan 2s linear infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0B0B0F;
            color: #ffffff;
        }
        
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .dash-border {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%234F4F5A' stroke-width='2' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        
        .dash-border.active {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%236366f1' stroke-width='2' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.2);
        }

        /* Custom Scrollbar for results */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- Interactive Background Canvas -->
    <canvas id="canvas-bg"></canvas>

    <!-- React Root -->
    <div id="root" class="min-h-screen w-full flex items-center justify-center p-6 relative z-10"></div>

    <!-- Background Animation Script -->
    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        
        // Mouse tracking
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            init();
        }

        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            draw() {
                ctx.fillStyle = `rgba(165, 180, 252, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 10;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 10;
                        }
                    }
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }
                
                // Slowly drift base positions
                this.baseY -= 0.1;
                if (this.baseY < 0) {
                    this.baseY = height;
                    this.x = this.baseX = Math.random() * width;
                }
            }
        }

        function init() {
            particles = [];
            // Around 400 grains of sand for a subtle feel
            let numParticles = Math.floor((width * height) / 4000); 
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].draw();
                particles[i].update();
            }
            requestAnimationFrame(animate);
        }

        resize();
        animate();
    </script>

    <!-- React App Script -->
    <script type="text/babel">
        // Extract framer-motion components
        const { motion, AnimatePresence } = window.Motion;
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [isDragging, setIsDragging] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            
            const fileInputRef = useRef(null);

            const handleFile = (selectedFile) => {
                if (selectedFile && selectedFile.type.startsWith('image/')) {
                    setFile(selectedFile);
                    setPreview(URL.createObjectURL(selectedFile));
                    setResult(null);
                    setError(null);
                }
            };

            const onDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const onDragLeave = (e) => {
                e.preventDefault();
                setIsDragging(false);
            };

            const onDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            };

            const onClickUpload = () => {
                fileInputRef.current.click();
            };

            const onChangeFile = (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            };

            const processImage = async () => {
                if (!file) return;
                
                setIsProcessing(true);
                setResult(null);
                setError(null);
                
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch('http://localhost:8000/predict', {
                        method: 'POST',
                        body: formData,
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        setResult({
                            text: data.text,
                            segments: data.segments_detected
                        });
                    } else {
                        setError(data.error || "Failed to process image.");
                    }
                } catch (err) {
                    setError("API Error: Backend server is not running on port 8000.");
                } finally {
                    setIsProcessing(false);
                }
            };

            // Reset image
            const clearImage = () => {
                setFile(null);
                setPreview(null);
                setResult(null);
                setError(null);
            };

            return (
                <div className="w-full max-w-4xl flex flex-col items-center gap-8 font-sans">
                    
                    {/* Header */}
                    <div className="text-center space-y-2">
                        <motion.h1 
                            initial={{ opacity: 0, y: -20 }}
                            animate={{ opacity: 1, y: 0 }}
                            className="text-4xl md:text-5xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-purple-400"
                        >
                            TrOCR Hybrid Engine
                        </motion.h1>
                        <motion.p 
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ delay: 0.2 }}
                            className="text-gray-400 text-sm md:text-base font-light tracking-wide rounded"
                        >
                            Upload multi-line handwritten notes for seamless segmentation and extraction.
                        </motion.p>
                    </div>

                    {/* Main Interaction Area */}
                    <div className="w-full flex flex-col md:flex-row gap-6">
                        
                        {/* Upload Zone */}
                        <motion.div 
                            initial={{ opacity: 0, scale: 0.95 }}
                            animate={{ opacity: 1, scale: 1 }}
                            transition={{ duration: 0.4 }}
                            className={`glass-panel w-full md:w-1/2 rounded-2xl p-2 relative flex flex-col ${preview ? 'h-[400px]' : 'h-[300px]'}`}
                        >
                            {!preview ? (
                                <div 
                                    className={`dash-border w-full h-full flex flex-col items-center justify-center cursor-pointer ${isDragging ? 'active' : ''}`}
                                    onDragOver={onDragOver}
                                    onDragLeave={onDragLeave}
                                    onDrop={onDrop}
                                    onClick={onClickUpload}
                                >
                                    <input 
                                        type="file" 
                                        ref={fileInputRef} 
                                        onChange={onChangeFile} 
                                        accept="image/*" 
                                        className="hidden" 
                                    />
                                    <div className="w-16 h-16 rounded-full bg-glass flex items-center justify-center mb-4 transition border border-glassBorder shadow-lg">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-8 h-8 text-indigo-400">
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                                        </svg>
                                    </div>
                                    <p className="text-gray-200 font-medium">Drop your handwritten note here</p>
                                    <p className="text-gray-500 text-sm mt-1">or click to browse</p>
                                </div>
                            ) : (
                                <div className="w-full h-full relative rounded-xl overflow-hidden bg-black/40">
                                    <img src={preview} alt="Preview" className="w-full h-full object-contain p-4" />
                                    
                                    {/* Scanning Animation */}
                                    {isProcessing && (
                                        <div className="absolute inset-0 overflow-hidden rounded-xl border-2 border-indigo-500/50">
                                            <div className="absolute top-0 left-0 right-0 h-1 bg-indigo-500 shadow-[0_0_15px_rgba(99,102,241,1)] animate-scan"></div>
                                            <div className="absolute inset-0 bg-indigo-500/10 pointer-events-none"></div>
                                        </div>
                                    )}

                                    {/* Close Button */}
                                    {!isProcessing && (
                                        <button 
                                            onClick={clearImage}
                                            className="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/60 hover:bg-black/80 flex items-center justify-center text-white transition border border-white/10"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4">
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Process Button */}
                            <AnimatePresence>
                                {preview && (
                                    <motion.button
                                        initial={{ opacity: 0, y: 10 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        exit={{ opacity: 0, y: 10 }}
                                        whileHover={{ scale: 1.02 }}
                                        whileTap={{ scale: 0.98 }}
                                        disabled={isProcessing}
                                        onClick={processImage}
                                        className={`absolute -bottom-5 left-1/2 -translate-x-1/2 px-8 py-3 rounded-full font-medium text-white shadow-[0_0_20px_rgba(99,102,241,0.3)] border border-indigo-400/30 transition-all ${isProcessing ? 'bg-indigo-600/50 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-500 to-purple-600 hover:shadow-[0_0_30px_rgba(99,102,241,0.5)]'}`}
                                    >
                                        {isProcessing ? (
                                            <span className="flex items-center gap-2">
                                                <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Processing...
                                            </span>
                                        ) : "Analyze Handwriting"}
                                    </motion.button>
                                )}
                            </AnimatePresence>
                        </motion.div>

                        {/* Result Panel */}
                        <AnimatePresence>
                            {(result || error || isProcessing) && (
                                <motion.div 
                                    initial={{ opacity: 0, x: 20 }}
                                    animate={{ opacity: 1, x: 0 }}
                                    exit={{ opacity: 0, x: 20 }}
                                    className="glass-panel w-full md:w-1/2 rounded-2xl flex flex-col overflow-hidden h-[400px]"
                                >
                                    <div className="border-b border-glassBorder bg-white/5 p-4 flex justify-between items-center">
                                        <h3 className="font-semibold text-gray-200">Extracted Text</h3>
                                        {result && (
                                            <span className="text-xs px-2 py-1 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                                                {result.segments} Lines Detected
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex-1 p-6 overflow-y-auto w-full max-w-full">
                                        {isProcessing ? (
                                            <div className="w-full h-full flex flex-col items-center justify-center text-gray-400 font-serif italic gap-4">
                                                <div className="w-full space-y-3">
                                                    <div className="h-2 w-3/4 bg-glassBorder rounded animate-pulse"></div>
                                                    <div className="h-2 w-full bg-glassBorder rounded animate-pulse"></div>
                                                    <div className="h-2 w-5/6 bg-glassBorder rounded animate-pulse"></div>
                                                </div>
                                                <p className="text-sm">TrOCR is reading...</p>
                                            </div>
                                        ) : error ? (
                                            <div className="w-full h-full flex items-center justify-center text-red-400 text-sm text-center">
                                                {error}
                                            </div>
                                        ) : result ? (
                                            <div className="w-full text-gray-100 font-serif leading-relaxed text-lg tracking-wide whitespace-pre-wrap break-words border-l-2 border-indigo-500/50 pl-4 py-2">
                                                {result.text}
                                            </div>
                                        ) : null}
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
